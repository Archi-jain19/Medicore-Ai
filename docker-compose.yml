# MediCore AI production stack:  PostgreSQL · Redis · migrate (one-shot) · API · web (nginx + SPA)
#
#   cp .env.production.example .env      # then fill in the secrets
#   docker compose up -d --build
#   open http://localhost:8080
#
# Only the web container is published. The API, database and Redis are reachable only on the internal network.
name: medicore

x-api-env: &api-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medicore}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-medicore}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  ENABLE_DOCS: ${ENABLE_DOCS:-false}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  OSM_USER_AGENT: ${OSM_USER_AGENT:-MediCoreAI/1.0 (educational project)}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medicore}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicore} -d ${POSTGRES_DB:-medicore}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    image: medicore-api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    image: medicore-api:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *api-env
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3g
    networks: [internal]

  web:
    image: medicore-web:${APP_VERSION:-latest}
    build:
      context: ./frontend
      args:
        VITE_OPERATOR_NAME: ${OPERATOR_NAME:-}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
